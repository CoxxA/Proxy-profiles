# ==================== 锚点配置 ====================
# 策略组类型模板 - 定义不同的策略组基础配置
BaseFB: &BaseFB {type: fallback, interval: 300, lazy: true, empty-fallback: REJECT, url: 'https://www.google.com/generate_204'}
BaseUT: &BaseUT {type: url-test, interval: 300, tolerance: 30, lazy: true, empty-fallback: REJECT, url: 'https://www.google.com/generate_204', hidden: true}

# 节点筛选正则表达式 - 基于地理位置和关键词过滤
FilterHK: &FilterHK "^(?i)(?=.*(香港|港深|深港|沪港|广港|陆港|(?<![a-zA-Z])(hk|hkg)(?![a-zA-Z])|hongkong|hong kong|🇭🇰))(?!.*(排除)).*$"
FilterTW: &FilterTW "^(?i)(?=.*(台湾|台北|台中|台南|台东|湾湾|(?<![a-zA-Z])(tw|tpe|khh|tsa)(?![a-zA-Z])|taiwan|taipei|🇹🇼|🇼🇸))(?!.*(排除)).*$"
FilterJP: &FilterJP "^(?i)(?=.*(日本|东京|大阪|京都|神奈川|琦玉|(?<![a-zA-Z])(jp|nrt|hnd|kix|cts|fuk)(?![a-zA-Z])|japan|tokyo|🇯🇵))(?!.*(排除)).*$"
FilterSG: &FilterSG "^(?i)(?=.*(新加坡|坡县|坡|狮城|(?<![a-zA-Z])(sg|sin|xsp)(?![a-zA-Z])|singapore|🇸🇬))(?!.*(排除)).*$"
FilterKR: &FilterKR "^(?i)(?=.*(韩国|韓國|首尔|首爾|南朝鲜|(?<![a-zA-Z])(kr|icn|gmp|pus)(?![a-zA-Z])|korea|seoul|🇰🇷))(?!.*(排除)).*$"
FilterUS: &FilterUS "^(?i)(?=.*(美国|美东|美西|美中|美南|美港|美日|中美|美专|(?<![a-zA-Z])(us|usa|lax|sfo|jfk|sjc)(?![a-zA-Z])|america|united states|🇺🇸))(?!.*(排除)).*$"
FilterAL: &FilterAL '^(?!.*(群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author))'

# 策略组代理列表模板 - 预定义的代理节点优先级排序
SelectFB: &SelectFB {type: select, proxies: [故障转移, 全球手动, 香港策略, 台湾策略, 日本策略, 狮城策略, 韩国策略, 美国策略, DIRECT]}
SelectPY: &SelectPY {type: select, proxies: [默认代理, 故障转移, 全球手动, 香港策略, 台湾策略, 日本策略, 狮城策略, 韩国策略, 美国策略, DIRECT]}
SelectDC: &SelectDC {type: select, proxies: [DIRECT, 默认代理, 故障转移, 全球手动, 香港策略, 台湾策略, 日本策略, 狮城策略, 韩国策略, 美国策略]}
SelectHK: &SelectHK {type: select, proxies: [香港策略, 默认代理, 故障转移, 全球手动, 台湾策略, 日本策略, 狮城策略, 韩国策略, 美国策略, DIRECT]}
SelectSG: &SelectSG {type: select, proxies: [狮城策略, 默认代理, 故障转移, 全球手动, 香港策略, 台湾策略, 日本策略, 韩国策略, 美国策略, DIRECT]}
SelectUS: &SelectUS {type: select, proxies: [美国策略, 默认代理, 故障转移, 全球手动, 香港策略, 台湾策略, 日本策略, 狮城策略, 韩国策略, DIRECT]}
SelectJP: &SelectJP {type: select, proxies: [日本策略, 默认代理, 故障转移, 全球手动, 香港策略, 台湾策略, 狮城策略, 韩国策略, 美国策略, DIRECT]}

# ==================== 核心配置 ====================
# 基础配置
mode: rule
mixed-port: 7890
ipv6: true
allow-lan: true
tcp-concurrent: true
unified-delay: true
keep-alive-interval: 15
keep-alive-idle: 600

# 使用dat格式，比mmdb更精确
geodata-mode: true
geo-auto-update: true

# 管理面板配置
external-controller: 127.0.0.1:9090

# 配置存储
profile:
  store-selected: true
  store-fake-ip: true

# 流量嗅探
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain: # 忽略嗅探
    - 'Mijia Cloud'
    - '+.push.apple.com'
    - '+.wechat.com'
    - '+.qpic.cn'
    - '+.qq.com'
    - '+.wechatapp.com'
    #  语音通信
    - '+.vivox.com'
    # 向日葵服务
    - '+.oray.com'
    - '+.sunlogin.net'
  skip-dst-address:
    - '149.154.160.0/20'
    - '185.76.151.0/24'
    - '91.105.192.0/23'
    - '91.108.16.0/21'
    - '91.108.4.0/22'
    - '91.108.56.0/22'
    - '91.108.8.0/21'
    - '95.161.64.0/20'
    - '2001:67c:4e8::/48'
    - '2001:b28:f23c::/47'
    - '2001:b28:f23f::/48'
    - '2a0a:f280::/29'
    - '127.0.0.0/8'        # 本机回环
    - '10.0.0.0/8'         # A类私有
    - '172.16.0.0/12'      # B类私有
    - '192.168.0.0/16'     # C类私有
    - '169.254.0.0/16'     # 链路本地
    - '224.0.0.0/4'        # 组播地址
    - '240.0.0.0/4'        # 保留地址
    - 'fc00::/7'           # IPv6 ULA
    - 'fe80::/10'          # IPv6 链路本地
    - '::1/128'            # IPv6 本机回环

# TUN模式配置
tun:
  enable: true
  stack: system
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: true
  
# DNS配置
dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: 2001:2::/48
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - RULE-SET,China,real-ip
    - RULE-SET,Proxy,fake-ip
    - MATCH,real-ip
  respect-rules: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 'https://8.8.8.8/dns-query'
    - 'https://9.9.9.10/dns-query'
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  direct-nameserver: [system]
  direct-nameserver-follow-policy: true
  nameserver-policy:
    'rule-set:Advertising': [rcode://success]
    'rule-set:China':
      - 'https://223.5.5.5/dns-query'
      - 'https://doh.pub/dns-query'

# ==================== 代理策略组 ====================
